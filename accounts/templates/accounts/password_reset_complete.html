{% extends "accounts/base.html" %}

{% block title %}Password updated | MultiFuel{% endblock %}

{% block content %}
<section class="single-card-wrap">
    <div class="auth-card notice-card">
        <span class="notice-icon" aria-hidden="true">✓</span>
        <p class="eyebrow">Account recovery</p>
        <h2>Password updated</h2>
        <p>Your password has been changed. Sign in with your new password to continue.</p>
        <a class="btn btn-primary w-100" href="{% url 'login' %}">Sign in</a>
    </div>
</section>
{% endblock %}
