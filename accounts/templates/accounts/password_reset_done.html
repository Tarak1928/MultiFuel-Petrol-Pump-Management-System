{% extends "accounts/base.html" %}

{% block title %}Check your email | MultiFuel{% endblock %}

{% block content %}
<section class="single-card-wrap">
    <div class="auth-card notice-card">
        <span class="notice-icon" aria-hidden="true">✉</span>
        <p class="eyebrow">Account recovery</p>
        <h2>Check your inbox</h2>
        <p>If an approved account matches that email address, we’ve sent instructions to reset its password.</p>
        <a class="btn btn-primary w-100" href="{% url 'login' %}">Return to sign in</a>
    </div>
</section>
{% endblock %}
